name: Java CI with Gradle

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Create Output Directory
      run: mkdir -p out/production/sma

    - name: Compile Java Sources
      run: |
        find src -name "*.java" > sources.txt
        javac -d out/production/sma -cp "lib/*" @sources.txt

    - name: Run Tests
      run: java -DtestMode=true -cp "out/production/sma:lib/*" TestUA
